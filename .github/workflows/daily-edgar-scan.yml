name: Daily EDGAR mining lead scan

# 6:30 PM Eastern during EDT = 22:30 UTC
# During EST this fires at 5:30 PM Eastern; adjust to '30 23 * * *' for winter if needed.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "EDGAR lookback days"
        required: false
        default: "3"
      max_hits:
        description: "Max hits per keyword"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily EDGAR scan
        env:
          SEC_USER_AGENT: CapitalDealflow/0.1 (github-actions@verdadai.capital-dealflow)
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_HITS: ${{ github.event.inputs.max_hits || '20' }}
          TZ: America/New_York
        run: |
          chmod +x scripts/daily_edgar_scan.sh
          ./scripts/daily_edgar_scan.sh

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgar-daily-leads
          path: |
            docs/leads/edgar_daily_latest.csv
            docs/leads/edgar_daily_*.csv
            data/signals.json
            data/logs/*.log
          if-no-files-found: warn

      - name: Commit lead CSVs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leads/edgar_daily_latest.csv docs/leads/edgar_daily_*.csv || true
          if git diff --staged --quiet; then
            echo "No lead CSV changes to commit"
          else
            git commit -m "chore: daily EDGAR mining leads $(TZ=America/New_York date +%F)"
            git push
          fi
